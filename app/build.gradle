plugins {
    id 'com.android.application'
}

// Fix duplicate Kotlin classes from older transitive dependencies.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' }
}

def releaseKeystorePath = System.getenv("UANGKU_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("UANGKU_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("UANGKU_KEY_ALIAS")
def releaseKeyPassword = System.getenv("UANGKU_KEY_PASSWORD")
def releaseSigningReady = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.uangku.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.uangku.app"
        minSdk 24
        targetSdk 35
        versionCode 87
        versionName "8.7.0"
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.15.0'
}
