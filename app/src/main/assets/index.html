<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7FAF4">
  <title>UangKu</title>
  <link rel="icon" type="image/png" href="uangku-app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="top-icon hidden" aria-label="Kembali"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="brand-wrap">
        <div id="brandLogo" class="brand">UangKu</div>
        <div id="brandTagline" class="brand-tagline">Catat. Rencanakan. Tenang.</div>
        <div id="pageTitle" class="page-title hidden">Beranda</div>
      </div>
      <div class="top-actions">
        <button id="headerAction" class="top-icon" aria-label="Notifikasi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
        <button id="themeToggle" class="top-icon theme-toggle-v82" type="button" aria-label="Mode terang" title="Mode terang">
          <span class="theme-sun-v82" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"/></svg>
          </span>
          <span class="theme-moon-v82" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg>
          </span>
        </button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav id="bottomNav" class="bottom-nav">
      <button data-page="home" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8L12 3l9 7.8"/><path d="M5 9.8V21h14V9.8"/><path d="M9 21v-6h6v6"/></svg></span><small>Beranda</small>
      </button>

      <button data-page="transactions" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><small>Transaksi</small>
      </button>

      <button id="quickAddNav" class="nav-add-item" aria-label="Tambah transaksi">
        <span class="nav-add-circle">+</span>
        <small>Tambah</small>
      </button>

      <button data-page="assistant" class="nav-item nav-assistant">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 5.5h11a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-6.8L6 20v-2.5H6.5a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"/>
          <path d="M9 11.5h.01M12 11.5h.01M15 11.5h.01"/>
          <path d="M17.3 4.1l.45-1.15.45 1.15 1.15.45-1.15.45-.45 1.15-.45-1.15-1.15-.45 1.15-.45Z"/>
        </svg></span><small>Asisten</small>
      </button>

      <button data-page="more" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span><small>Lainnya</small>
      </button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-head">
        <h2 id="modalTitle">Form</h2>
        <button class="top-icon soft" data-close-modal>×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
