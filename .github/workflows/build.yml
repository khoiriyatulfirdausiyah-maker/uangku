name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UangKu code health
        run: node tests/code-health.js

      - name: UangKu finance smoke tests
        run: node tests/finance-smoke.js

      - name: UangKu daily-use hardening tests
        run: node tests/daily-hardening.js

      - name: UangKu theme mode tests
        run: node tests/theme-mode.js

      - name: UangKu performance tests
        run: node tests/performance-smoke.js

      - name: UangKu no-voice tests
        run: node tests/no-voice.js

      - name: UangKu manual-input-only tests
        run: node tests/manual-input-only.js

      - name: UangKu category split tests
        run: node tests/category-split.js

      - name: UangKu performance rebuild tests
        run: node tests/performance-rebuild.js

      - name: UangKu launcher icon tests
        run: node tests/launcher-icon.js

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build test/debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.UANGKU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UANGKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UANGKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UANGKU_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets belum lengkap. Debug APK tetap dibuat."
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UANGKU_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/uangku-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          UANGKU_KEYSTORE_PATH: ${{ runner.temp }}/uangku-release.jks
          UANGKU_KEYSTORE_PASSWORD: ${{ secrets.UANGKU_KEYSTORE_PASSWORD }}
          UANGKU_KEY_ALIAS: ${{ secrets.UANGKU_KEY_ALIAS }}
          UANGKU_KEY_PASSWORD: ${{ secrets.UANGKU_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload test/debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UangKu-v8.11-TEST-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
       
